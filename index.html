<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>♥</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0912; --bg2:#151020; --ink:#f6ede8; --muted:#b9aab5;
  --rose:#f3a5b8; --rose2:#e0708e; --gold:#f1d29a; --card:#1b1527cc; --line:#3a2c46;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Cormorant Garamond",Georgia,serif;font-size:20px;line-height:1.55;overflow-x:hidden}
body.kilitli{overflow:hidden;height:100vh}
#yildizlar{position:fixed;inset:0;z-index:0;pointer-events:none}
main{position:relative;z-index:1;overflow-x:clip}
@supports not (overflow-x:clip){main{overflow-x:hidden}}
.el{font-family:"Caveat",cursive}

/* Kapı + perde */
#kapi,#perde{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;transition:opacity 1.6s ease}
#kapi{z-index:21;background:radial-gradient(ellipse at 50% 40%,#1a1226,var(--bg) 70%)}
#perde{z-index:20}
#kapi.git,#perde.git{opacity:0;pointer-events:none}
#kapi .giris{font-style:italic;color:var(--muted);font-size:clamp(18px,4vw,22px);opacity:0;animation:belir 1.6s .4s forwards}
#kapi .giris+.giris{animation-delay:1.8s}
#kapiIc{margin-top:34px;opacity:0;animation:belir 1.6s 3.4s forwards}
@keyframes belir{to{opacity:1}}
.soru{margin-bottom:22px}
.sorumetin{font-size:clamp(22px,5vw,30px);color:var(--gold)}
.saatsec{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:14px;font-size:40px;color:var(--rose)}
.saatsec select,input.yazi{appearance:none;-webkit-appearance:none;background:var(--bg2);color:var(--ink);border:1px solid var(--line);border-radius:14px;font:inherit;text-align:center;text-align-last:center}
.saatsec select{font-size:38px;padding:8px 18px;cursor:pointer;font-variant-numeric:tabular-nums}
input.yazi{font-size:26px;padding:10px 18px;margin-top:14px;width:min(320px,80vw)}
.saatsec select:focus,input.yazi:focus{outline:none;border-color:var(--rose)}
input.yazi::placeholder{color:#b9aab580;font-style:italic}
#sorular.salla{animation:salla .45s}
@keyframes salla{20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
#uyari{min-height:32px;font-family:"Caveat",cursive;font-size:22px;color:var(--rose)}
#ac{margin-top:8px;background:none;border:1px solid var(--rose);color:var(--rose);font:inherit;font-size:22px;padding:12px 34px;border-radius:999px;cursor:pointer;transition:all .3s}
#ac:hover:not(:disabled){background:var(--rose);color:var(--bg)}
#ac:disabled{opacity:.5}
#perde p{font-size:clamp(22px,5vw,34px);opacity:0;transform:translateY(10px);transition:all 1.5s ease;margin:6px 0;font-style:italic}
#perde p.gor{opacity:1;transform:none}
#perde p:last-child{font-family:"Caveat",cursive;font-style:normal;color:var(--rose);font-size:clamp(30px,7vw,46px);margin-top:14px}

/* Sayaç */
section{padding:16vh 16px;max-width:1000px;margin:0 auto;text-align:center}
.ust{color:var(--muted);letter-spacing:.25em;text-transform:uppercase;font-size:14px}
#gun{font-size:clamp(90px,22vw,200px);line-height:1;color:var(--gold);font-weight:600;margin:14px 0 4px;text-shadow:0 0 50px #f1d29a33}
.alt{font-size:clamp(22px,4vw,30px)}
#saat{font-variant-numeric:tabular-nums;color:var(--rose);font-size:clamp(20px,4vw,28px);margin-top:10px}
.asagi{margin-top:12vh;color:var(--muted);font-size:16px;animation:zipla 2.2s infinite}
@keyframes zipla{50%{transform:translateY(8px)}}

/* Akış */
#akis{position:relative;max-width:1000px;margin:0 auto;padding:0 16px 4vh}
#yol,#yolIsik svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
#yol{z-index:0}
#yolIsik{position:absolute;left:0;top:0;width:100%;height:0;overflow:hidden;pointer-events:none;z-index:0}
#yol path,#yolIsik path{fill:none;stroke-linecap:round}
#yol .soluk{stroke:#ffffff2e;stroke-width:1.5;stroke-dasharray:2 9}
#yolIsik .hale{stroke:#f3a5b8;stroke-opacity:.16;stroke-width:10}
#yolIsik .parlak{stroke:url(#yolRenk);stroke-width:2.2}
.yildiz{position:absolute;z-index:1;width:30px;height:30px;margin:-15px 0 0 -15px;opacity:.38;transform:scale(.5);transition:opacity .8s,transform .8s cubic-bezier(.2,1.7,.4,1);pointer-events:none;background:radial-gradient(circle,#fff 0 9%,#f3a5b8 15%,#f3a5b800 48%)}
.yildiz::before,.yildiz::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,#fff 0,#fff0 68%)}
.yildiz::before{transform:scale(1.6,.09)}.yildiz::after{transform:scale(.09,1.6)}
.yildiz b{position:absolute;inset:0;border-radius:50%;border:1px solid #fff;opacity:0}
.yildiz.altin{width:42px;height:42px;margin:-21px 0 0 -21px;background:radial-gradient(circle,#fff 0 10%,#f1d29a 17%,#f1d29a00 52%)}
.yildiz.altin b{border-color:var(--gold)}
.yildiz.yandi{opacity:1;transform:scale(1);animation:pir 3.4s ease-in-out infinite}
.yildiz.yandi b{animation:halka 1.3s ease-out 1}
@keyframes pir{50%{filter:brightness(1.5) drop-shadow(0 0 8px #fff9)}}
@keyframes halka{from{transform:scale(.3);opacity:.9}to{transform:scale(3.6);opacity:0}}
#yolcu{position:absolute;left:0;top:0;z-index:2;width:0;height:0;pointer-events:none;opacity:0}
#yolcu i,.inis i{position:absolute;left:-13px;top:-13px;width:26px;height:26px;animation:don 2.8s linear infinite}
#yolcu i::before,#yolcu i::after,.inis i::before,.inis i::after{content:"";position:absolute;top:9px;width:8px;height:8px;border-radius:50%;background:#fff}
#yolcu i::before,.inis i::before{left:0;box-shadow:0 0 10px 3px var(--rose)}
#yolcu i::after,.inis i::after{right:0;box-shadow:0 0 10px 3px var(--gold)}
@keyframes don{to{transform:rotate(360deg)}}
.yil{position:relative;z-index:1;text-align:center;padding:20vh 0 9vh}
.yil::before{content:"";position:absolute;left:50%;top:60%;width:min(620px,100%);height:70%;transform:translate(-50%,-50%);background:radial-gradient(ellipse at center,var(--bg) 38%,#0c091200 72%);z-index:-1}
.yil .konum{color:var(--muted);letter-spacing:.3em;text-transform:uppercase;font-size:13px;margin-bottom:8px;text-shadow:0 2px 12px #000}
.yil .no{display:inline-block;font-size:clamp(56px,12vw,96px);color:var(--gold);line-height:1;text-shadow:0 0 40px #f1d29a44,0 2px 14px #000c}
.yil h2{font-weight:400;font-style:italic;font-size:clamp(24px,4.5vw,34px);color:var(--rose);display:inline-block;text-shadow:0 2px 14px #000c}
.yil .bilgi{color:var(--muted);font-size:16px;margin-top:6px;display:inline-block;text-shadow:0 2px 12px #000}
.gezegen{position:absolute;top:52%;width:230px;z-index:-1;pointer-events:none;transform:translateY(calc(-50% + var(--py,0px)));filter:drop-shadow(0 0 26px var(--isik,#fff5));will-change:transform}
.gezegen svg{display:block;width:100%;height:auto;overflow:visible}
.gezegen.sol{left:1%}.gezegen.sag{right:1%}
.gezegen.g-saturn{width:330px}
.gezegen.g-saturn.sol{left:-8%}.gezegen.g-saturn.sag{right:-8%}
.gezegen.g-galaksi{width:380px;filter:none}
.gezegen.g-jupiter{width:250px}
.gezegen.g-mars{width:180px}
.gezegen.g-ay{width:160px}
.ani{position:relative;z-index:1;width:calc(50% - 70px);margin:6vh 0;opacity:0;transition:all 1.1s cubic-bezier(.2,.7,.2,1)}
.ani.sol{margin-right:auto;transform:translateX(-40px)}
.ani.sag{margin-left:auto;transform:translateX(40px)}
.ani.gor{opacity:1;transform:none}
.isin{position:absolute;top:40px;height:1px;width:0;background:linear-gradient(90deg,#f3a5b8cc,#fff0);opacity:0;transform:scaleX(0);transition:transform .9s ease .15s,opacity .9s ease .15s;pointer-events:none}
.isin.soldan{right:calc(100% + 10px);transform-origin:0 50%}
.isin.sagdan{left:calc(100% + 10px);transform-origin:100% 50%;background:linear-gradient(270deg,#f3a5b8cc,#fff0)}
.ani.bagli .isin{opacity:1;transform:none}
.donum .isin{background:linear-gradient(90deg,#f1d29acc,#fff0)}
.donum .isin.sagdan{background:linear-gradient(270deg,#f1d29acc,#fff0)}
#mesafe{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:9;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);background:#0c0912eb;border:1px solid var(--line);border-radius:999px;padding:6px 16px;opacity:0;transition:opacity .7s;pointer-events:none;white-space:nowrap;font-variant-numeric:tabular-nums}
#mesafe.acik{opacity:1}
.kart{background:#1a1426ee;border:1px solid var(--line);border-radius:18px;overflow:hidden;text-align:left;box-shadow:0 18px 50px #0006}
.kart .foto{position:relative;background:radial-gradient(circle at 30% 30%,#3a2440,#1b1527);overflow:hidden}
.serit{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.serit::-webkit-scrollbar{display:none}
.kare{flex:0 0 100%;height:100%;scroll-snap-align:center;scroll-snap-stop:always;position:relative;overflow:hidden}
.kare.sig{background:#08060c}
.kart .kare.sig img,.kart .kare.sig video{object-fit:contain}
.kart .foto img.poster{cursor:default}
.oynat{position:absolute;inset:0;margin:auto;width:74px;height:74px;border-radius:50%;border:1px solid #fff9;background:#0009;color:#fff;font-size:28px;line-height:1;padding-left:6px;cursor:pointer;backdrop-filter:blur(4px);transition:transform .25s}
.oynat:hover{transform:scale(1.08)}
.oynat.bekle{animation:nabiz .9s infinite;pointer-events:none}
@keyframes nabiz{50%{opacity:.35}}
.ok{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;border:0;background:#0008;color:#fff;font-size:24px;line-height:1;cursor:pointer;padding-bottom:4px}
.ok.geri{left:8px}.ok.ileri{right:8px}
.ok[hidden]{display:none}
.sayac{position:absolute;right:10px;top:10px;background:#0009;color:#fff;font:13px/1.6 system-ui,sans-serif;padding:1px 10px;border-radius:999px;pointer-events:none}
.noktalar{position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:center;gap:6px;pointer-events:none}
.noktalar i{width:6px;height:6px;border-radius:50%;background:#fff6;transition:all .3s}
.noktalar i.secili{background:#fff;transform:scale(1.35)}
.kart .foto img{display:block;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.06);transition:opacity 1.4s ease,transform 2.4s ease;cursor:zoom-in}
.kart .foto img.yuklu{opacity:1;transform:none}
.kart .foto video{display:block;width:100%;height:100%;object-fit:cover;background:#000}
.kart .ic{padding:18px 22px 22px}
.tarih{color:var(--gold);font-size:15px;letter-spacing:.08em}
.kart h3{font-size:26px;font-weight:600;line-height:1.2;margin:4px 0 8px}
.kart p{color:#e5d8de;white-space:pre-line}
.kart .kac{font-family:"Caveat",cursive;color:var(--rose);font-size:20px;margin-top:10px}
.donum .kart{border-color:var(--gold);box-shadow:0 0 40px #f1d29a22}
.donum h3{color:var(--gold)}

/* Uzay sisi */
.sis{position:fixed;inset:0;z-index:0;pointer-events:none}
.sis.mor{background:radial-gradient(ellipse 70% 50% at 12% 18%,#5b2a8a3d,transparent 70%),radial-gradient(ellipse 60% 45% at 88% 78%,#8a2a5b30,transparent 70%)}
.sis.yilSis{opacity:0;transition:opacity 1.8s ease}
.sis.yilSis.acik{opacity:1}
.sis.mavi{opacity:0;background:radial-gradient(ellipse 90% 60% at 50% 105%,#1f6fd066,transparent 70%),radial-gradient(ellipse 60% 40% at 82% 12%,#1b4f9c40,transparent 70%)}

/* Varış: Dünya */
#varis{position:relative;height:300vh;z-index:1;--p:0;--q:0;--lx:0px;--ly:0px;--d:min(128vw,78vh);--s:clamp(0,calc(var(--p)/.7),1);--k:clamp(0,calc((var(--p) - .86)/.1),1)}
#varis .yapisik{position:sticky;top:0;height:100vh;overflow:hidden;text-align:center;padding:10vh 20px 0;-webkit-mask-image:linear-gradient(#000 72%,#0000 98%);mask-image:linear-gradient(#000 72%,#0000 98%)}
.vyazi{position:relative;z-index:2}
.vyazi p{font-style:italic;font-size:clamp(22px,4.6vw,34px);margin:8px 0;opacity:0;transform:translateY(14px);transition:opacity 1.1s,transform 1.1s;text-shadow:0 2px 20px #000}
.vyazi p.gor{opacity:1;transform:none}
.vyazi p:last-child{font-family:"Caveat",cursive;font-style:normal;color:var(--gold);font-size:clamp(36px,8vw,58px);margin-top:14px}
.dunyaKap{position:absolute;left:50%;bottom:calc(var(--d)*-.27);width:var(--d);height:var(--d);transform:translate(-50%,calc((1 - var(--s))*-24vh)) scale(calc(.05 + .95*var(--s)))}
.dunya{width:100%;height:100%;border-radius:50%;overflow:hidden;box-shadow:0 0 50px #7fc0ffaa,0 0 170px #3c7bff66}
.dunya svg{display:block}
.inis{position:absolute;left:0;top:0;width:0;height:0;z-index:1;opacity:0;transform:translate(var(--lx),var(--ly))}
.inis i{opacity:calc(1 - var(--k));transform-origin:13px 13px}
.inis i::before{left:calc(9px - 9px*(1 - var(--q)))}
.inis i::after{right:calc(9px - 9px*(1 - var(--q)))}
.inis b{position:absolute;left:0;top:0;transform:translate(-50%,-50%) scale(calc(.15 + .85*var(--k)));opacity:var(--k);color:#ff8fab;font-size:clamp(46px,9vw,74px);line-height:1;font-weight:400;text-shadow:0 0 22px #ff5c8a,0 0 70px #ff5c8aaa}
.inis b span{display:inline-block;animation:at 1.2s infinite}
#ufuk{position:relative;z-index:1;height:38vh;overflow:hidden;pointer-events:none;-webkit-mask-image:linear-gradient(#0000,#000 55%);mask-image:linear-gradient(#0000,#000 55%)}
#ufuk div{position:absolute;left:50%;top:19vh;width:260vw;height:260vw;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle at 50% 0%,#6dbbf7 0,#2068c4 2.2%,#0c2f74 6.5%,#06153a 15%);box-shadow:0 0 70px #6dbbf7aa,0 0 190px #2a6bff77}

/* Sayılar */
.sayilar{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px;margin-top:40px}
.sayi{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px 16px}
.sayi b{display:block;font-size:clamp(36px,7vw,48px);color:var(--gold);font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.sayi span{color:var(--muted);font-size:17px}
h2.bas{font-weight:400;font-style:italic;font-size:clamp(30px,6vw,46px);color:var(--rose)}

/* Nedenler */
#neden{max-width:560px;margin:36px auto 0;min-height:190px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:34px 26px 22px;cursor:pointer;display:flex;flex-direction:column;justify-content:center;user-select:none}
#nedenMetin{font-family:"Caveat",cursive;font-size:clamp(28px,6vw,38px);line-height:1.25;color:var(--ink);transition:opacity .45s}
#nedenMetin.sol{opacity:0}
#nedenSayi{color:var(--muted);font-size:15px;margin-top:18px}

/* Mektup */
#mektup .mkAlt{color:var(--muted);font-size:17px;margin-top:6px}
#mektuplar{max-width:660px;margin:34px auto 0;display:flex;flex-direction:column;gap:14px}
.zarf{width:100%;display:flex;align-items:center;gap:14px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 18px;color:var(--ink);font:inherit;cursor:pointer;transition:border-color .3s,background .3s}
.zarf:hover,.mk.acik .zarf{border-color:var(--rose)}
.zarf .ikon{flex:none;width:42px;height:30px;position:relative;border:1.5px solid var(--gold);border-radius:4px;overflow:hidden}
.zarf .ikon::before{content:"";position:absolute;left:50%;top:-18px;width:26px;height:26px;border:1.5px solid var(--gold);transform:translateX(-50%) rotate(45deg);transition:top .5s}
.mk.acik .zarf .ikon::before{top:-30px}
.zarf .ikon::after{content:"♥";position:absolute;left:0;right:0;bottom:1px;text-align:center;font-size:11px;color:var(--rose2)}
.zarf .yazi{flex:1;min-width:0;display:flex;flex-direction:column}
.zarf .mT{color:var(--gold);font-size:14px;letter-spacing:.08em}
.zarf .mB{font-family:"Caveat",cursive;font-size:26px;line-height:1.15;color:var(--rose);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zarf .yeni{display:none;flex:none;font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--bg);background:var(--gold);border-radius:999px;padding:2px 9px}
.mk.yeniMk .zarf .yeni{display:inline-block}
.zarf .ok{flex:none;color:var(--muted);transition:transform .4s}
.mk.acik .zarf .ok{transform:rotate(90deg)}
.kagitKap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .8s ease}
.mk.acik .kagitKap{grid-template-rows:1fr}
.kagitKap>div{overflow:hidden;min-height:0;padding:0 8px}
.mk .kagit{margin:18px auto 34px!important}
.kagit .mTarih{text-align:right;font-family:"Caveat",cursive;font-size:22px;color:#8a6f74;margin-bottom:10px}
.kagit .mBas{font-family:"Caveat",cursive;font-size:clamp(28px,6vw,36px);color:var(--rose2);margin-bottom:14px;line-height:1.2}
#mektup .kagit{max-width:640px;margin:40px auto 0;text-align:left;background:#f7efe6;color:#3b2a2f;border-radius:6px;padding:clamp(26px,6vw,56px);box-shadow:0 30px 80px #0008;transform:rotate(-.6deg)}
#mektup .kagit p{font-family:"Caveat",cursive;font-size:clamp(22px,4.5vw,28px);line-height:1.45;margin-bottom:16px;white-space:pre-line}
#mektup .imza{text-align:right;font-family:"Caveat",cursive;font-size:30px;color:var(--rose2)}

/* Son */
#son h1{font-family:"Caveat",cursive;font-size:clamp(56px,14vw,120px);color:var(--rose);line-height:1;font-weight:700}
#son .alt{margin-top:18px}
#saat2{color:var(--gold);font-variant-numeric:tabular-nums;font-size:clamp(20px,4vw,28px);margin-top:8px}
#kalpBtn{margin-top:36px;font-size:54px;background:none;border:0;cursor:pointer;animation:at 1.2s infinite;color:var(--rose2)}
@keyframes at{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(1)}45%{transform:scale(1.12)}}
.ucan{position:fixed;z-index:30;pointer-events:none;font-size:24px;animation:uc 3s ease-out forwards}
@keyframes uc{to{transform:translate(var(--dx),-70vh) rotate(var(--r));opacity:0}}
#muzikBtn{position:fixed;right:16px;bottom:16px;z-index:11;background:#1b1527f2;border:1px solid var(--line);color:var(--rose);border-radius:50%;width:46px;height:46px;font-size:20px;cursor:pointer;display:none}
#muzikBtn.acik{border-color:var(--rose)}
#calar{position:fixed;right:16px;bottom:72px;z-index:11;width:min(300px,calc(100vw - 32px));background:#130e1bfc;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:18px;padding:16px 14px 12px;font-variant-numeric:lining-nums;box-shadow:0 20px 60px #000a;opacity:0;transform:translateY(10px) scale(.97);transform-origin:bottom right;pointer-events:none;transition:opacity .3s,transform .3s}
#calar.acik{opacity:1;transform:none;pointer-events:auto}
#calar .clBas{color:var(--muted);font-size:13px;letter-spacing:.25em;text-transform:uppercase;padding:0 6px 8px}
#clListe{list-style:none;max-height:40vh;overflow-y:auto}
#clListe button{width:100%;display:flex;align-items:center;gap:10px;background:none;border:0;border-radius:10px;padding:9px 8px;color:var(--ink);font:inherit;font-size:18px;line-height:1.25;text-align:left;cursor:pointer}
#clListe button:hover{background:#ffffff0d}
#clListe .no{flex:none;width:18px;color:var(--muted);font-size:14px;text-align:center}
#clListe .su button{color:var(--rose)}
#clListe .su .no{color:var(--rose);font-size:17px;animation:at 1.2s infinite}
#calar.durgun #clListe .su .no{animation:none;opacity:.6}
#calar .clTus{display:flex;justify-content:center;gap:12px;margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
#calar .clTus button{background:none;border:1px solid var(--line);color:var(--rose);border-radius:999px;width:44px;height:38px;font-size:16px;cursor:pointer}
#calar .clTus button:hover{border-color:var(--rose)}
.fade{opacity:0;transform:translateY(30px);transition:all 1.2s ease}.fade.gor{opacity:1;transform:none}

/* Büyük fotoğraf + o dakika */
#buyuk{position:fixed;inset:0;z-index:40;background:#07050bee;display:none;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
#buyuk.acik{display:flex}
#buyuk img{max-width:100%;max-height:100%;border-radius:10px;box-shadow:0 20px 80px #000}
#dakika{position:fixed;left:50%;top:18px;transform:translate(-50%,-140%);z-index:35;background:#241a30;border:1px solid var(--gold);color:var(--gold);border-radius:999px;padding:10px 22px;font-family:"Caveat",cursive;font-size:22px;max-width:calc(100vw - 32px);text-align:center;transition:transform 1s cubic-bezier(.2,.8,.2,1),opacity .6s;box-shadow:0 0 40px #f1d29a44;opacity:0;visibility:hidden}
#dakika.acik{transform:translate(-50%,0);opacity:1;visibility:visible}

  .ani,.ani.sol,.ani.sag{width:auto;margin-left:58px;margin-right:0;transform:translateY(30px)}

  .yil{text-align:left;margin-left:58px;padding:200px 0 7vh}
  .yil::before{top:66%;height:56%}

  .gezegen.g-saturn,.gezegen.g-saturn.sol,.gezegen.g-saturn.sag{width:240px;left:auto;right:-84px}
  .gezegen.g-galaksi{width:260px;right:-70px}

  .gezegen.g-mars{width:120px;right:-10px}
  .gezegen.g-ay{width:110px;right:-6px}
  .sayilar{grid-template-columns:1fr 1fr;gap:12px}
  .sayi{padding:18px 8px}
  .sayi b{font-size:30px}
  .yil::before{left:40%}
}

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const p2 = n => String(n).padStart(2, "0");
const fmt = n => n.toLocaleString("tr-TR");
const trTarih = d => d.toLocaleDateString("tr-TR", { day: "numeric", month: "long", year: "numeric" });
const gunFarki = (a, b) => Math.floor((b - a) / 864e5);
// kur.mjs içindeki ile birebir aynı olmalı
const sade = s => String(s).replace(/İ/g, "i").replace(/I/g, "ı").toLowerCase()
  .replace(/ı/g, "i").replace(/ş/g, "s").replace(/ğ/g, "g").replace(/ü/g, "u").replace(/ö/g, "o").replace(/ç/g, "c")
  .replace(/[^a-z0-9]/g, "");
// Yazılı cevap: girilen cümlenin içinde doğru kelime geçiyorsa (ekli ya da ekli değil) kapı açılır.
// Her kelimenin baştan başlayan parçaları ayrı ayrı denenir: "evimizin önünde" → evimizin, evimizi, evimiz, ... ev
const ADAY_EN_AZ = 2, ADAY_EN_COK = 60;
const adaylar = metin => {
  const s = new Set();
  for (const k of String(metin).split(/[\s,.;:!?'’"()\/-]+/)) { const w = sade(k); for (let n = w.length; n >= ADAY_EN_AZ; n--) s.add(w.slice(0, n)); }
  return [...s].slice(0, ADAY_EN_COK);
};
const ilkParola = (cevaplar, turler) => cevaplar.filter((_, i) => turler[i] !== "yazi").map(sade).join("|");

// Yol üstündeki gök cisimleri: [üst yazı, ışık rengi]
const GOK = {
  galaksi: ["çok uzak bir galakside", "#b98cff"], neptun: ["Neptün'ü geçerken", "#6f9bff"], saturn: ["Satürn'ün halkalarında", "#e8d49a"],
  jupiter: ["Jüpiter'in yanından", "#e3b58a"], mars: ["Mars'ı geride bırakırken", "#e0714a"], ay: ["Ay'a vardık, Dünya göründü", "#cfd6e6"]
};
const GOK_SIRA = ["neptun", "saturn", "jupiter", "mars", "ay"];
function gezegen(tur) {
  const F = (bf, oct, seed, m) => `<filter id="f-${tur}" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency="${bf}" numOctaves="${oct}" seed="${seed}"/><feColorMatrix values="${m}"/></filter>`;

// Önce saatten ilk anahtar, sonra cümledeki her kelime parçası aynı anda denenir; içeriği açan anahtar kazanır
async function ac(cevaplar) {
  const turler = KASA.sorular.map(s => s.tur), tuz = b64(KASA.tuz), enc = new TextEncoder(), veri = b64(KASA.veri);

  const yi = turler.indexOf("yazi"), liste = yi < 0 ? [""] : adaylar(cevaplar[yi]);
  if (!liste.length) throw new Error("bos");
  return Promise.any(liste.map(async w => {
    const ek = enc.encode("|" + w), birlesik = new Uint8Array(ilk.length + ek.length); birlesik.set(ilk); birlesik.set(ek, ilk.length);
    const h2 = await crypto.subtle.importKey("raw", birlesik, "PBKDF2", false, ["deriveKey"]);
    const k = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: tuz, iterations: KASA.tur2, hash: "SHA-256" }, h2, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);

}

}

function fark(a, b) {
  let y = b.getFullYear() - a.getFullYear(), m = b.getMonth() - a.getMonth(), d = b.getDate() - a.getDate();
  if (b.getHours() * 3600 + b.getMinutes() * 60 + b.getSeconds() < a.getHours() * 3600 + a.getMinutes() * 60 + a.getSeconds()) d--;
  if (d < 0) { m--; d += new Date(b.getFullYear(), b.getMonth(), 0).getDate(); }
  if (m < 0) { y--; m += 12; }

}

}

function sahneyiKur() {
  const simdi = new Date();
  const olaylar = I.anilar.map(a => ({ ...a, t: new Date(a.tarih + "T12:00:00") }));
  for (let i = 1; i <= 80; i++) { // yıl dönümleri kendiliğinden

        : `<div class="kare${sig}"><img alt="" data-f="${id}"></div>`;

    return `<div class="foto" style="aspect-ratio:${A}"><div class="serit">${kareler}</div>${cok ? `<button class="ok geri" aria-label="önceki" hidden>‹</button><button class="ok ileri" aria-label="sonraki">›</button><div class="sayac">1 / ${ids.length}</div><div class="noktalar">${ids.map((_, i) => `<i${i ? "" : ' class="secili"'}></i>`).join("")}</div>` : ""}</div>`;

    }
    const g = gunFarki(gun0, o.t);

  }

  const nedenler = I.nedenler || [];
  const dg = I.dogumGunu, bugun = p2(simdi.getMonth() + 1) + "-" + p2(simdi.getDate());
  $("#sahne").innerHTML = `
  <section>

    <div class="alt">gündür seninleyim</div>

  </section>
  <div id="akis"><svg id="yol"><path class="soluk"/></svg>
    <div id="yolIsik"><svg><defs><linearGradient id="yolRenk" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="1000"><stop offset="0" stop-color="#f1d29a"/><stop offset="1" stop-color="#f3a5b8"/></linearGradient></defs><path class="hale"/><path class="parlak"/></svg></div>
    <div id="yolcu"><i></i></div>${akis}</div>

    <div class="vyazi">${(I.varis || []).map(x => `<p>${esc(x).replace("{gun}", fmt(gunFarki(BAS, simdi))).replace("{yildiz}", olaylar.length)}</p>`).join("")}</div>
    <div class="dunyaKap"><div class="dunya">${DUNYA}</div></div>

  </div></div>
  <section class="fade"><h2 class="bas">Sayılarla biz</h2><div class="sayilar" id="sayilar"></div></section>
  ${nedenler.length ? `<section class="fade"><h2 class="bas">Seni sevmemin nedenleri</h2>
    <div id="neden"><div id="nedenMetin"></div><div id="nedenSayi"></div></div></section>` : ""}
  ${mektupHTML()}
  <section id="son" class="fade">

    <button id="kalpBtn" aria-label="kalp">♥</button>
  </section>
  <div id="ufuk"><div></div></div>`;

  mektuplariBagla();
  // canlı sayaç + sayılar
  const tik = () => { const t = sureMetni(); $("#saat").textContent = t; $("#saat2").textContent = t; };
  tik(); setInterval(tik, 1000);
  const sayilar = () => {
    const s = new Date(), dk = Math.floor((s - BAS) / 6e4), gun = Math.floor(dk / 1440);
    const v = [[fmt(gun), "gün"], [fmt(Math.floor(dk / 60)), "saat"], [fmt(dk), "dakika"],
      [fmt(Math.floor(gun / 29.53)), "dolunay"], [s.getFullYear() - BAS.getFullYear(), "yeni yıla birlikte girdik"],
      [fmt(Math.floor(gun / 7)), "hafta sonu"], ["~" + fmt(Math.round(dk * 72 / 1e6)) + " milyon", "kez attı kalbim, hep senin için"], ["∞", "ve daha nicesi"]];

  };

  const yukle = img => {

  };
  const fo = new IntersectionObserver(es => es.forEach(e => {

  // video: dokununca indirilip çözülür; oynarken şarkı susar, bitince geri gelir
  const durdur = haric => document.querySelectorAll("#akis video").forEach(v => { if (v !== haric && !v.paused) v.pause(); });
  const oynat = btn => {
    btn.classList.add("bekle");
    const kare = btn.parentNode, p = kare.querySelector("img");
    dosya(btn.dataset.v).then(u => {
      const v = document.createElement("video");
      v.controls = true; v.playsInline = true; v.preload = "auto"; if (p && p.src) v.poster = p.src;
      v.onplay = () => { durdur(v); if (!ses.paused || sesIs && susturuldu) { susturuldu = true; sesGecis(0, 500); } };
      v.onpause = v.onended = () => setTimeout(() => { // başka video oynamıyorsa şarkı geri gelsin
        const oynayan = [...document.querySelectorAll("#akis video")].some(x => !x.paused && !x.ended);
        if (susturuldu && !oynayan) { susturuldu = false; sesGecis(SES, 1500); }

    }).catch(() => { btn.classList.remove("bekle"); });
  };

  // çizgi kaydırdıkça dolsun
  // yol: yıldızdan yıldıza kıvrılan çizgi; kaydırdıkça parlar, iki ışık üstünde ilerler
  const akisEl = $("#akis"), yol = $("#yol"), yolIsik = $("#yolIsik"), isikSvg = yolIsik.firstElementChild, yolcu = $("#yolcu"), varis = $("#varis"), yapisik = $("#varis .yapisik"), dunyaKap = $(".dunyaKap"), inis = $(".inis"), mesafe = $("#mesafe");
  const yollar = akisEl.querySelectorAll("#yol path,#yolIsik path");
  const vSatir = [...document.querySelectorAll(".vyazi p")], sisMavi = $(".sis.mavi");
  const KAY = [-34, 26, -12, 38, -28, 8, 34, -40, 16, -20];
  [...akisEl.querySelectorAll(".ani")].forEach((el, i) => {
    const y = document.createElement("i"); y.className = "yildiz" + (el.classList.contains("donum") ? " altin" : ""); y.innerHTML = "<b></b>";
    akisEl.appendChild(y); el._y = y; el._k = KAY[i % KAY.length]; el._b = el.querySelector(".isin");
  });
  // her yılın kendi sis rengi
  const yilEl = [...akisEl.querySelectorAll(".yil")];
  $("#sisler").innerHTML = yilEl.map((el, i) => { const c = GOK[el.dataset.tur][1];
    return `<div class="sis yilSis" style="background:radial-gradient(ellipse 70% 52% at ${i % 2 ? 86 : 14}% 20%,${c}3d,transparent 70%),radial-gradient(ellipse 62% 46% at ${i % 2 ? 12 : 88}% 82%,${c}2b,transparent 70%)"></div>`; }).join("");
  const yilSis = [...document.querySelectorAll(".yilSis")], gezegenler = yilEl.map(el => el.querySelector(".gezegen"));
  let tablo = [[0, 0]], H = 0, yildizlar = [], yilUst = [], aktifYil = -1, cxYol = 0, sonMesafe = "";
  function yoluKur() {
    const W = akisEl.clientWidth, dar = innerWidth <= 720, cx = dar ? 28 : W / 2;
    H = akisEl.offsetHeight; cxYol = cx;
    const n = [[cx, 0]]; yildizlar = []; yilUst = [];
    akisEl.querySelectorAll(".yil,.ani").forEach(el => {

        const x = cx + el._k * (dar ? .42 : 1), y = top + 40; el._y.style.left = x + "px"; el._y.style.top = y + "px";

  }
  let bekleyen = false;
  const kis = (x, a, b) => Math.max(a, Math.min(b, x));
  function yolGuncelle() {

    const ih = innerHeight, r = akisEl.getBoundingClientRect(), y = kis(ih * .55 - r.top, 0, H);
    let a = 0, b = tablo.length - 1;
    while (b - a > 1) { const m = (a + b) >> 1; if (tablo[m][0] <= y) a = m; else b = m; }
    const A = tablo[a], B = tablo[b], f = B[0] > A[0] ? kis((y - A[0]) / (B[0] - A[0]), 0, 1) : 0, x = A[1] + (B[1] - A[1]) * f;
    const yolda = y > 0 && y < H;

    yolcu.style.transform = `translate(${x}px,${y}px)`; yolcu.style.opacity = yolda ? 1 : 0;
    let son = -1;
    yildizlar.forEach(([sy, el, kart], i) => { const yanik = sy <= y + 6; if (yanik) son = i; el.classList.toggle("yandi", yanik); kart.classList.toggle("bagli", yanik); });
    // Dünya'ya kalan gün: iki yıldız arasında yumuşakça akar
    if (yolda && yildizlar.length) {
      const simdi = Date.now(), o = son < 0 ? [0, 0, 0, BAS.getTime()] : yildizlar[son], s = yildizlar[son + 1] || [H, 0, 0, simdi];
      const t = o[3] + (s[3] - o[3]) * (s[0] > o[0] ? kis((y - o[0]) / (s[0] - o[0]), 0, 1) : 0);
      const m = `Dünya'ya ${fmt(Math.max(0, Math.round((simdi - t) / 864e5)))} gün`;
      if (m !== sonMesafe) mesafe.textContent = sonMesafe = m;
    }
    mesafe.classList.toggle("acik", yolda);
    // yılın sisi + gezegenlerin derinliği
    let yi = -1; yilUst.forEach(([top], i) => { if (top <= y + ih * .25) yi = i; });
    if (yi !== aktifYil) { aktifYil = yi; yilSis.forEach((e, i) => e.classList.toggle("acik", i === Math.max(0, yi))); }
    yilUst.forEach(([top, h], i) => { const m = r.top + top + h / 2 - ih / 2; if (Math.abs(m) < ih * 1.2) gezegenler[i].style.setProperty("--py", (m * -.22).toFixed(1) + "px"); });

    const v = varis.getBoundingClientRect(), yr = yapisik.getBoundingClientRect(), p = kis(-v.top / Math.max(1, v.height - yr.height), 0, 1);
    varis.style.setProperty("--p", p.toFixed(4));

    const q = kis((ih * .55 - v.top) / (ih * .55 + (v.height - yr.height) * .84), 0, 1), q2 = q * q;
    const lx0 = r.left + cxYol - yr.left, ly0 = ih * .55 - yr.top, lx1 = yapisik.clientWidth / 2, ly1 = dunyaKap.offsetTop + dunyaKap.offsetWidth * .23;
    const lx = lx0 + (lx1 - lx0) * q2, ly = ly0 + (ly1 - ly0) * q2; // yapışık kutunun içindeki konum

  }

  let rz; const yeniden = () => { clearTimeout(rz); rz = setTimeout(yoluKur, 150); };
  addEventListener("resize", yeniden);
  if (window.ResizeObserver) new ResizeObserver(yeniden).observe(akisEl);
  yoluKur(); if (document.fonts && document.fonts.ready) document.fonts.ready.then(yoluKur);

  // fotoğrafı büyüt

    const t = e.target;

  });

    const s = e.target; if (!s.classList || !s.classList.contains("serit")) return;
    const f = s.parentNode, n = s.children.length, i = Math.max(0, Math.min(n - 1, Math.round(s.scrollLeft / s.clientWidth)));
    if (f._i === i) return; f._i = i;
    s.querySelectorAll("video").forEach(v => v.pause());
    f.querySelector(".sayac").textContent = `${i + 1} / ${n}`;
    f.querySelectorAll(".noktalar i").forEach((d, j) => d.classList.toggle("secili", j === i));
    f.querySelector(".geri").hidden = i === 0; f.querySelector(".ileri").hidden = i === n - 1;
  }, true);
  buyuk.onclick = () => buyuk.classList.remove("acik");

  // nedenler
  if (nedenler.length) {
    let n = 0; const m = $("#nedenMetin");
    const goster = () => { m.textContent = nedenler[n]; $("#nedenSayi").textContent = `${n + 1} / ${nedenler.length} · dokun`; };
    goster();
    $("#neden").onclick = () => { m.classList.add("sol"); setTimeout(() => { n = (n + 1) % nedenler.length; goster(); m.classList.remove("sol"); }, 450); };
  }

  // kalpler
  $("#kalpBtn").onclick = e => {
    for (let i = 0; i < 28; i++) {
      const k = document.createElement("div"); k.className = "ucan"; k.textContent = ["♥", "❤", "💗", "✨"][i % 4];
      k.style.left = e.clientX + "px"; k.style.top = e.clientY + "px";
      k.style.setProperty("--dx", (Math.random() * 300 - 150) + "px"); k.style.setProperty("--r", (Math.random() * 90 - 45) + "deg");
      k.style.fontSize = (16 + Math.random() * 24) + "px"; k.style.animationDelay = (Math.random() * .3) + "s";
      document.body.appendChild(k); setTimeout(() => k.remove(), 3500);
    }
  };
}

/* ---------- O dakika: her gün tam o saatte küçük bir not ---------- */
let dakikaGosterildi = false;
function oDakika() {
  const kontrol = () => {
    const s = new Date(), ayni = s.getHours() === BAS.getHours() && s.getMinutes() === BAS.getMinutes();
    if (ayni && !dakikaGosterildi) {
      dakikaGosterildi = true;
      const d = $("#dakika"); d.textContent = `Şu an saat tam ${p2(BAS.getHours())}:${p2(BAS.getMinutes())}. Bu dakikada benim olmuştun ♥`;
      d.classList.add("acik"); setTimeout(() => d.classList.remove("acik"), 55000);
    }
    if (!ayni) dakikaGosterildi = false;
  };
  kontrol(); setInterval(kontrol, 5000);
}

/* ---------- Gökyüzü: derinlikli yıldızlar, hızla uzayan izler, kayan yıldızlar, kıvılcımlar ---------- */
const cv = $("#yildizlar"), cx = cv.getContext("2d");
let yz = [], DPR = 1, cw = 0, sonKay = 0, hiz = 0, kayan = null, sonrakiKayan = 2500, kivilcim = [];
const azHareket = matchMedia("(prefers-reduced-motion:reduce)").matches;
function boyut() {
  DPR = Math.min(2, devicePixelRatio || 1);
  cv.height = innerHeight * DPR;
  if (innerWidth === cw) return; // yalnızca yükseklik değiştiyse (telefonda adres çubuğu) yıldızlar yerinde kalsın
  cw = innerWidth; cv.width = cw * DPR;
  yz = Array.from({ length: Math.min(230, Math.floor(cw / 4.5)) }, () => ({ x: Math.random() * cw, y: Math.random() * 2000, z: .12 + Math.random() ** 2 * .88, f: Math.random() * 6.28, h: .4 + Math.random() * 1.2 }));
}
boyut(); addEventListener("resize", boyut);
(function ciz(t) {
  const W = cv.width, Hc = cv.height, ih = Hc / DPR, sy = scrollY, v = sy - sonKay; sonKay = sy;
  hiz += (kis2(v, -160, 160) - hiz) * .18;
  cx.clearRect(0, 0, W, Hc);
  cx.lineCap = "round";
  for (const s of yz) { // yakındaki yıldız daha hızlı kayar; hızlanınca iz bırakır
    let y = (s.y - sy * s.z * .16) % (ih + 40); if (y < 0) y += ih + 40; y -= 20;
    const r = (.35 + s.z * 1.25) * DPR, iz = azHareket ? 0 : hiz * s.z * 1.5;
    cx.globalAlpha = .22 + .6 * s.z * (.55 + .45 * Math.sin(t / 1000 * s.h + s.f));
    if (Math.abs(iz) > 2) { cx.strokeStyle = "#f6ede8"; cx.lineWidth = r * 1.3; cx.beginPath(); cx.moveTo(s.x * DPR, y * DPR); cx.lineTo(s.x * DPR, (y + iz) * DPR); cx.stroke(); }
    else { cx.fillStyle = "#f6ede8"; cx.beginPath(); cx.arc(s.x * DPR, y * DPR, r, 0, 6.28); cx.fill(); }
  }
  if (!azHareket) {
    if (!kayan && t > sonrakiKayan) { // kayan yıldız
      const a = .35 + Math.random() * .5, sag = Math.random() < .5 ? 1 : -1;
      kayan = { x: (sag > 0 ? .05 + Math.random() * .5 : .45 + Math.random() * .5) * cw, y: Math.random() * ih * .45, vx: Math.cos(a) * sag, vy: Math.sin(a), d: t, hz: 700 + Math.random() * 500 };
    }
    if (kayan) {
      const g = (t - kayan.d) / 900;
      if (g >= 1) { kayan = null; sonrakiKayan = t + 3500 + Math.random() * 6000; }
      else {
        const m = g * kayan.hz, x = kayan.x + kayan.vx * m, y = kayan.y + kayan.vy * m, kuyruk = 130 * Math.sin(g * Math.PI);
        const gr = cx.createLinearGradient(x * DPR, y * DPR, (x - kayan.vx * kuyruk) * DPR, (y - kayan.vy * kuyruk) * DPR);
        gr.addColorStop(0, "#ffffff"); gr.addColorStop(1, "#ffffff00");
        cx.globalAlpha = Math.sin(g * Math.PI); cx.strokeStyle = gr; cx.lineWidth = 1.8 * DPR;
        cx.beginPath(); cx.moveTo(x * DPR, y * DPR); cx.lineTo((x - kayan.vx * kuyruk) * DPR, (y - kayan.vy * kuyruk) * DPR); cx.stroke();
      }

    if (k && Math.abs(v) > .6 && kivilcim.length < 90) for (let i = Math.min(3, 1 + Math.abs(v) / 14 | 0); i--;)
      kivilcim.push({ x: k[0] + (Math.random() - .5) * 14, y: k[1] + (Math.random() - .5) * 10, vx: (Math.random() - .5) * .7, vy: (Math.random() - .5) * .7, o: 1, s: .012 + Math.random() * .02, r: .7 + Math.random() * 1.6, c: Math.random() < .5 ? "#f3a5b8" : "#f1d29a" });
